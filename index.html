<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Adana'nın en yuvarlak topu kim? Cevabı öğren!">
  <title>Adana'nın En Yuvarlak Topu</title>
  <style>
    :root { color-scheme: dark; --bg:#090d18; --panel:#121a2b; --muted:#a8b3c7; --accent:#72e0b2; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:#f7f9fc;
      background: radial-gradient(ellipse at 15% 15%, #1d3450 0, transparent 42%),
                  radial-gradient(ellipse at 85% 85%, #183b36 0, transparent 38%), var(--bg);
    }
    main {
      width:min(100%,680px); padding:clamp(28px,6vw,56px); text-align:center;
      background:linear-gradient(145deg,rgba(22,32,52,.96),rgba(13,20,34,.96));
      border:1px solid rgba(255,255,255,.12); border-radius:28px;
      box-shadow:0 28px 90px rgba(0,0,0,.42);
    }
    .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.18em; font-size:.76rem; font-weight:800; }
    h1 { margin:18px 0 14px; font-size:clamp(2rem,7vw,4rem); line-height:1.05; letter-spacing:-.045em; }
    p { color:var(--muted); font-size:1.05rem; line-height:1.6; margin:0 auto; max-width:46ch; }
    button {
      margin-top:32px; border:0; border-radius:999px; padding:16px 28px;
      background:var(--accent); color:#082018; font-size:1rem; font-weight:850;
      cursor:pointer; transition:transform .18s ease, filter .18s ease;
    }
    button:hover { transform:translateY(-2px); filter:brightness(1.06); }
    button:focus-visible { outline:3px solid white; outline-offset:4px; }
    #answer { display:none; margin:30px auto 0; padding:22px; border-radius:18px;
      background:rgba(114,224,178,.1); border:1px solid rgba(114,224,178,.32); }
    #answer.visible { display:block; animation:pop .35s ease both; }
    #answer small { display:block; color:var(--muted); margin-bottom:8px; }
    #answer strong { color:var(--accent); font-size:clamp(2rem,8vw,3.5rem); letter-spacing:-.04em; }
    footer { margin-top:34px; color:#77849a; font-size:.8rem; }
    @keyframes pop { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Adana'ya özel soru</div>
    <h1>Adana'nın en yuvarlak topu kimdir?</h1>
    <p>Cevabı merak ettin mi? Öğrenmek için aşağıdaki butona dokun.</p>
    <button id="reveal" type="button" aria-controls="answer" aria-expanded="false">Cevabı göster</button>
    <section id="answer" aria-live="polite">
      <small>Doğru cevap:</small>
      <strong>Sinan Diler</strong>
    </section>
    <footer>Bu site tamamen eğlence amaçlıdır.</footer>
  </main>
  <script>
    const button = document.getElementById('reveal');
    const answer = document.getElementById('answer');
    button.addEventListener('click', () => {
      answer.classList.add('visible');
      button.setAttribute('aria-expanded', 'true');
      button.textContent = 'Cevap bulundu!';
    });
  </script>
</body>
</html>
